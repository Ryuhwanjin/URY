name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main, windows/phase3, "codex/**"]
    tags: ["v0.9.9"]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            URY_Windows/system/requirements.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r URY_Windows/system/requirements.txt pyinstaller pillow python-pptx python-docx

      - name: Run regression tests
        shell: pwsh
        run: python -B -m unittest discover -s tests

      - name: Build URY onedir bundle
        shell: pwsh
        run: |
          if (-not (Test-Path "URY_Windows/app_icon.ico")) { throw "Missing URY_Windows/app_icon.ico" }
          python -m PyInstaller --noconfirm --clean --onedir --windowed `
            --name URY `
            --icon URY_Windows/app_icon.ico `
            --paths URY_Windows/system/code `
            --add-data "URY_Windows/system;system" `
            --add-data "assets;assets" `
            --hidden-import audio_recorder `
            --hidden-import sounddevice `
            --collect-all sounddevice `
            --collect-all _sounddevice_data `
            --hidden-import config_manager `
            --hidden-import doc_parser `
            --hidden-import generate_cheatsheet `
            --hidden-import generate_master_bible `
            --hidden-import generate_mock_exams `
            --hidden-import generate_pdfs `
            --hidden-import generate_roadmap `
            --hidden-import lecture_tutor `
            --hidden-import pdf_viewer `
            --hidden-import process_all_lectures `
            --hidden-import update_checker `
            URY_Windows/system/code/settings_gui.py

      - name: Include user documentation
        shell: pwsh
        run: |
          $documents = @("USER_GUIDE.md", "USER_GUIDE.pdf", "시스템_저장경로_안내.md", "시스템_저장경로_안내.pdf")
          foreach ($document in $documents) {
            $source = Join-Path "URY_Windows" $document
            $target = Join-Path "dist/URY" $document
            if (-not (Test-Path $source)) { throw "Missing source document: $source" }
            Copy-Item $source $target -Force
          }

      - name: Verify bundle
        shell: pwsh
        run: |
          $exe = "dist/URY/URY.exe"
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          if (-not (Test-Path "dist/URY/_internal")) { throw "Missing PyInstaller _internal directory" }
          $prompt = Get-ChildItem -Path "dist/URY" -Recurse -File -Filter "강의노트_한국어_프롬프트.txt" | Select-Object -First 1
          if (-not $prompt) { throw "Missing bundled lecture-note prompt" }
          Write-Host "Bundled prompt: $($prompt.FullName)"
          $portaudio = Get-ChildItem -Path "dist/URY" -Recurse -File -Filter "libportaudio*.dll" | Select-Object -First 1
          if (-not $portaudio) { throw "Missing bundled PortAudio DLL" }
          Write-Host "Bundled PortAudio: $($portaudio.FullName)"
          $documents = @("USER_GUIDE.md", "USER_GUIDE.pdf", "시스템_저장경로_안내.md", "시스템_저장경로_안내.pdf")
          foreach ($document in $documents) {
            if (-not (Test-Path (Join-Path "dist/URY" $document))) { throw "Missing user document: $document" }
          }
          Get-Item $exe

      - name: Package build artifact
        shell: pwsh
        run: Compress-Archive -Path dist/URY -DestinationPath URY_Windows_v0.9.9_onedir.zip

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Missing Inno Setup compiler: $iscc" }
          & $iscc "installer\URY_v0.9.9.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          $setup = "dist/installer/URY_Engine_v0.9.9_Installer.exe"
          if (-not (Test-Path $setup)) { throw "Missing $setup" }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: URY_Windows_v0.9.9_onedir
          path: URY_Windows_v0.9.9_onedir.zip

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: URY_Windows_v0.9.9_setup
          path: dist/installer/URY_Engine_v0.9.9_Installer.exe

  publish-release:
    if: github.ref == 'refs/tags/v0.9.9'
    needs: build-windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@v4

      - name: Download onedir artifact
        uses: actions/download-artifact@v4
        with:
          name: URY_Windows_v0.9.9_onedir
          path: release-assets/onedir

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: URY_Windows_v0.9.9_setup
          path: release-assets/setup

      - name: Update v0.9.9 release assets and notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notes = "RELEASE_NOTES_$tag.md"
          $onedir = "release-assets/onedir/URY_Windows_v0.9.9_onedir.zip"
          $installer = "release-assets/setup/URY_Engine_v0.9.9_Installer.exe"
          $releaseZip = "release-assets/URY_Engine_v0.9.9_Windows.zip"
          foreach ($file in @($notes, $onedir, $installer)) {
            if (-not (Test-Path $file)) { throw "Missing release file: $file" }
          }
          Copy-Item $onedir $releaseZip -Force
          gh release edit $tag --title "URY v0.9.9 — Windows Markdown 접근 오류 수정" --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw "Could not update release notes for $tag" }
          gh release upload $tag $releaseZip $installer --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload Windows release assets for $tag" }
